version: '3.8'

volumes:
  db_volume:
  redis_volume:
  app_smith_volume:
  python_service_volume:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:

networks:
  horus:

services:
  db:
    build:
      context: ./.docker/postgres
      dockerfile: Dockerfile
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: horusdb
    ports:
      - "5432:5432"
    volumes:
      - db_volume:/var/lib/postgresql/data
    networks:
      - horus
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d horusdb" ]
      interval: 10s
      retries: 10
      start_period: 10s
      timeout: 3s
  
  redis:
    image: redis:latest
    container_name: redis
    volumes:
      - redis_volume:/data
    ports:
      - "6380:6379"
    env_file:
      - .env
    networks:
      - horus
    command: [ "redis-server","--save",
               "60",
               "1",
               "--loglevel",
               "warning",
               "--requirepass",
               "$REDIS_PASSWORD" ]
  appsmith:
    image: index.docker.io/appsmith/appsmith-ce
    container_name: appsmith
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - app_smith_volume:/appsmith-stacks
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  python_service:
    build:
      context: .
      dockerfile: python_services/Dockerfile  
    container_name: python_service
    ports:
      - "8000:8000"  
    volumes:
      - ./python_services:/app  

  neo4j:
    image: neo4j:4.4.42-community
    container_name: neo4j
    ports:
      - "7474:7474"  
      - "7687:7687"  
    environment:
      - NEO4J_AUTH=neo4j/pedro12345  
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins