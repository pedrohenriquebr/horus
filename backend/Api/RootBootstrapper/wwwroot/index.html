<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Horus Chat</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/6.0.1/signalr.js"></script>
    <script  src="/horusService.js"></script>
<script  src="/index.js"></script> 
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css"
  />

    <link rel="stylesheet" href="/style.css">
   
</head>
<body class="bg-[#1E1E1E] text-white h-screen flex flex-col ">
    <!-- Menu Toggle -->
    <button id="menuToggle" class="absolute left-4 top-4 z-40  rounded-md text-white px-1">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Sidebar -->
    <div id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-[#171717] transition-transform duration-300 ease-in-out z-50 -translate-x-full ">
        <div class="p-4 flex items-center justify-between border-b border-gray-800">
            <div class="flex items-center gap-2 text-indigo-400 font-semibold">
                <i class="fas fa-comment-alt w-6 h-6"></i>
                <span>Horus Chat</span>
            </div>
            <i class="bi bi-x cursor-pointer text-gray-400 hover:text-gray-200  text-xl"
               onclick="toggleSideBar()"></i>
        </div>

        <div class="p-4 space-y-4 h-[calc(100vh-160px)] flex flex-col">
            <button id="newChatBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-4 rounded-md flex items-center gap-2 w-full">
                <i class="fas fa-plus w-4 h-4"></i>
                New Chat
            </button>

            <div class="relative">
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" placeholder="Search" 
                       class="w-full bg-[#2A2A2A] rounded-md py-2 pl-10 pr-4 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500">
            </div>

            <!-- Chat List -->
            <div class="flex-1 overflow-y-auto" id="chatList"></div>
        </div>

        <!-- User Profile -->
        <div class="p-4 border-t border-gray-800 mt-auto">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-full bg-gray-600"></div>
                <span class="text-sm">Current User</span>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden ">
        <header class="h-14 border-b border-gray-800 flex items-center px-4 shrink-0">
            <div class="flex items-center justify-end w-full">
                <button class="text-gray-400 hover:text-white px-3 py-1 rounded-md transition-colors">
                    Documents
                </button>
            </div>
        </header>

        <!-- Chat Area -->
        <main id='main-container' class="flex-1 flex flex-col overflow-hidden p-4 md:mx-4 xl:mx-[30%]">
            <h1 id="chat-title" class="text-3xl mb-8">New Chat</h1>
            
            <!-- Messages Container -->
            <div class="chat-container duration-500 flex  flex-col overflow-y-auto mb-4 space-y-4"></div>

            <!-- Input Container -->
            <div id="input-container" class="sticky bottom-0 bg-[#1E1E1E] pt-4 pb-6 max-w">
                <div class="bg-[#1A1A1A] rounded-2xl p-3 shadow-xl">
                    <div class="flex items-center gap-3 mb-2 text-gray-400 text-sm">
                        <button class="flex items-center gap-1.5 hover:bg-[#2A2A2A] px-2 py-1 rounded-md transition-colors">
                            <i class="fas fa-search w-4 h-4"></i>
                            Web Search
                        </button>
                        <div class="flex-grow"></div>
                        <button class="hover:bg-[#2A2A2A] p-1.5 rounded-md transition-colors">
                            <i class="fas fa-link w-4 h-4"></i>
                        </button>
                        <button class="hover:bg-[#2A2A2A] p-1.5 rounded-md transition-colors">
                            <i class="fas fa-image w-4 h-4"></i>
                        </button>
                    </div>

                    <div class="relative">
                        <textarea 
                        id="message-input"
                        placeholder="How can I help you today?"
                        rows="1"
                        class="w-full bg-transparent resize-none 
                                     focus:outline-none pr-10 text-[15px] 
                                     placeholder-gray-500
                                     transition
                                     duration-300"
                        oninput="autoResize(this)"
                        onkeydown="checkSend(event)"
                      ></textarea>
                      <button 
                       id="sendBtn"
                      class="absolute rounded-full right-0 top-1/2 h-10 w-10 
                      -translate-y-1/2 bg-[#4B4B4B]  
                      hover:bg-[#5B5B5B] transition-colors">
                            <i class="fas fa-arrow-up w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Delete Modal -->
    <div id="deleteModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-[#2A2A2A] rounded-lg p-6 w-full max-w-md">
            <h3 class="text-lg font-medium text-gray-100 mb-4">Delete Chat</h3>
            <p class="text-gray-400 mb-6">Are you sure you want to delete this chat? This action cannot be undone.</p>
            <div class="flex justify-end space-x-3">
                <button id="cancelDelete" class="px-4 py-2 text-gray-300 hover:text-white transition-colors">
                    Cancel
                </button>
                <button id="confirmDelete" class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 transition-colors">
                    Delete
                </button>
            </div>
        </div>
    </div>
